# Modified for OpsFlow: added lint:check + typecheck + conventional commit check
# Per AGENTS.md §1.9 (Conventional Commits) and §7 (Pre-Commit Checklist)

name: Deploy to Firebase Hosting on PR
on: pull_request
permissions:
  checks: write
  contents: read
  pull-requests: write
jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate PR title (Conventional Commits)
        run: |
          PR_TITLE="${{ github.event.pull_request.title }}"
          if ! echo "$PR_TITLE" | grep -qE '^(feat|fix|chore|security|style|docs|refactor|test|perf)(\(.+\))?: .+$'; then
            echo "❌ PR title does not follow Conventional Commits format."
            echo "Expected: type(scope): description"
            echo "Allowed types: feat, fix, chore, security, style, docs, refactor, test, perf"
            echo "Example: feat(auth): add tenant isolation"
            exit 1
          fi
          echo "✅ PR title follows Conventional Commits"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint check
        run: yarn lint:check

      - name: Type check
        run: yarn typecheck

      - name: Build
        run: yarn build

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_OPSFLOW_88OF }}
          projectId: opsflow-88of
